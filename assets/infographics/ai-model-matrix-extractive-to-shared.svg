<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 1402" width="1122" height="1402" role="img" aria-labelledby="mx-title mx-desc" font-family="Arial, Helvetica, sans-serif">
<title id="mx-title">AI models: from extractive to shared</title>
<desc id="mx-desc">A matrix of AI models. Columns show the licence of the weights: open source licence, open weights with another licence, and frontier models with closed weights. Rows show the treatment of sources, from shared at the top to not disclosed at the bottom. Shared: Sovereign Source SI (proposed). Permitted and recorded: Comma v0.1, KL3M, Pleias 1.0, CommonLLM (proposed). Partly open or partly paid: OLMo 2, IBM Granite, gpt-oss, Gemma 4, Mistral Small 4, Nemotron 3 Ultra, Llama 4, Muse Spark Open, OpenAI GPT, Google Gemini, Anthropic Claude. Not disclosed: Qwen3, DeepSeek, xAI Grok.</desc>
<rect width="1122" height="1402" fill="#fbfaf6"/>
<text x="56" y="76" font-size="40" fill="#173d36" font-weight="700" text-anchor="start" >AI models: from extractive to shared</text>
<text x="56" y="114" font-size="21" fill="#606c66" font-weight="400" text-anchor="start" >Across: the licence of the weights. Up: how the model treats its sources.</text>
