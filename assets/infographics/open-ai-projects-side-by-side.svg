<circle cx="971" cy="722" r="19" fill="#fbfaf6" stroke="#173d36" stroke-width="3" stroke-dasharray="6 6"/>
<text x="971" y="764" font-size="15" fill="#606c66" font-weight="400" text-anchor="middle" >by agreement</text>
