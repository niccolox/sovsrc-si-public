<text x="401" y="1030" font-size="14.5" fill="#606c66" font-weight="400" text-anchor="middle" >tokens at one host</text>
<rect x="502" y="924" width="178" height="136" rx="10" fill="#ffffff" stroke="#d5dcd5" stroke-width="2"/>
<text x="591" y="976" font-size="34" fill="#173d36" font-weight="700" text-anchor="middle" >$0</text>
<text x="591" y="1010" font-size="14.5" fill="#606c66" font-weight="400" text-anchor="middle" >for the tool; the user</text>
<text x="591" y="1030" font-size="14.5" fill="#606c66" font-weight="400" text-anchor="middle" >pays for compute</text>
<rect x="692" y="924" width="178" height="136" rx="10" fill="#ffffff" stroke="#d5dcd5" stroke-width="2"/>
