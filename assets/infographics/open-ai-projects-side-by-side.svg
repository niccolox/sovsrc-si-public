<text x="56" y="1210" font-size="19" fill="#606c66" font-weight="400" text-anchor="start" >selects it</text>
<line x1="56" y1="1294" x2="1066" y2="1294" stroke="#173d36" stroke-width="2"/>
<text x="56" y="1324" font-size="17" fill="#173d36" font-weight="400" text-anchor="start" >CommonLLM is a proposal. No CommonLLM model exists today.</text>
<text x="56" y="1350" font-size="17" fill="#606c66" font-weight="400" text-anchor="start" >Prices checked on 25 November 2026. The training cost is an estimate. Sources are in the article.</text>
<text x="1066" y="1324" font-size="20" fill="#386d52" font-weight="700" text-anchor="end" >sovsrc.si</text>
</svg>
