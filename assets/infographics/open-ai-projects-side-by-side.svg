<text x="971" y="1010" font-size="14.5" fill="#606c66" font-weight="400" text-anchor="middle" >compute for one training</text>
<text x="971" y="1030" font-size="14.5" fill="#606c66" font-weight="400" text-anchor="middle" >run (estimate)</text>
<text x="56" y="976" font-size="19" fill="#606c66" font-weight="400" text-anchor="start" >Before the</text>
<text x="56" y="1000" font-size="19" fill="#606c66" font-weight="400" text-anchor="start" >first result</text>
<text x="56" y="1128" font-size="25" fill="#173d36" font-weight="700" text-anchor="start" >Business benefit</text>
<line x1="56" y1="1148" x2="1066" y2="1148" stroke="#d5dcd5" stroke-width="2"/>
<text x="401" y="1186" font-size="17" fill="#173d36" font-weight="400" text-anchor="middle" >High capability now,</text>
