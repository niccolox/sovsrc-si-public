<text x="591" y="288" font-size="15" fill="#606c66" font-weight="400" text-anchor="middle" >openwaldo.org</text>
<rect x="692" y="156" width="178" height="150" rx="10" fill="#edf3ef" stroke="#386d52" stroke-width="2"/>
<text x="781" y="188" font-size="15" fill="#386d52" font-weight="700" text-anchor="middle" letter-spacing="2">REWARDS</text>
<text x="781" y="226" font-size="23" fill="#173d36" font-weight="700" text-anchor="middle" >Sovereign</text>
<text x="781" y="256" font-size="23" fill="#173d36" font-weight="700" text-anchor="middle" >Source SI</text>
<text x="781" y="288" font-size="15" fill="#606c66" font-weight="400" text-anchor="middle" >sovsrc.si</text>
