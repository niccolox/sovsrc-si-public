<text x="971" y="188" font-size="15" fill="#386d52" font-weight="700" text-anchor="middle" letter-spacing="2">DATA</text>
<text x="971" y="226" font-size="23" fill="#173d36" font-weight="700" text-anchor="middle" >CommonLLM</text>
<text x="971" y="256" font-size="20" fill="#173d36" font-weight="400" text-anchor="middle" >(proposed)</text>
<text x="971" y="288" font-size="15" fill="#606c66" font-weight="400" text-anchor="middle" >commonllm.org</text>
<text x="56" y="226" font-size="19" fill="#606c66" font-weight="400" text-anchor="start" >What each</text>
<text x="56" y="250" font-size="19" fill="#606c66" font-weight="400" text-anchor="start" >project supplies</text>
<text x="56" y="366" font-size="25" fill="#173d36" font-weight="700" text-anchor="start" >What each project has today</text>
<line x1="56" y1="388" x2="1066" y2="388" stroke="#d5dcd5" stroke-width="2"/>
<text x="56" y="444" font-size="20" fill="#173d36" font-weight="400" text-anchor="start" >A trained model</text>
