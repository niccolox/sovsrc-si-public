<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 1402" width="1122" height="1402" role="img" aria-labelledby="ig-title ig-desc" font-family="Arial, Helvetica, sans-serif">
<title id="ig-title">Four open AI projects, side by side</title>
<desc id="ig-desc">A comparison of Nemotron 3 Ultra, OpenWALDO, Sovereign Source SI and the CommonLLM proposal. Nemotron 3 Ultra has a trained model and an open licence, source records in part, and no method to pay contributors. OpenWALDO has an open licence and source records, but no model and no payment method. Sovereign Source SI has source records and a payment calculation, but no model and no selected licence. CommonLLM is a proposal: each item is planned. Cost to start: 2.15 dollars for each million output tokens for Nemotron 3 Ultra at one host; no cost for the OpenWALDO tool; low for Sovereign Source SI; an estimate of 0.2 to 0.4 million dollars of compute for one CommonLLM training run.</desc>
<rect width="1122" height="1402" fill="#fbfaf6"/>
<text x="56" y="78" font-size="40" fill="#173d36" font-weight="700" text-anchor="start" >Four open AI projects, side by side</text>
<text x="56" y="116" font-size="22" fill="#606c66" font-weight="400" text-anchor="start" >One released model, one tool set, one rewards service and one proposal</text>
