<text x="591" y="764" font-size="15" fill="#606c66" font-weight="400" text-anchor="middle" >none</text>
<circle cx="781" cy="722" r="19" fill="#fbfaf6" stroke="#173d36" stroke-width="3"/>
<path d="M781 703 A19 19 0 0 0 781 741 Z" fill="#173d36"/>
