<text x="401" y="1234" font-size="17" fill="#173d36" font-weight="400" text-anchor="middle" >permitted</text>
<text x="591" y="1186" font-size="17" fill="#173d36" font-weight="400" text-anchor="middle" >Proof of what is</text>
<text x="591" y="1210" font-size="17" fill="#173d36" font-weight="400" text-anchor="middle" >in a model</text>
<text x="781" y="1186" font-size="17" fill="#173d36" font-weight="400" text-anchor="middle" >A reason for content</text>
<text x="781" y="1210" font-size="17" fill="#173d36" font-weight="400" text-anchor="middle" >owners to give</text>
<text x="781" y="1234" font-size="17" fill="#173d36" font-weight="400" text-anchor="middle" >permission</text>
